name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a red build be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in composer.json, and the version used in dev.
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant_hub_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the test suite
        # phpunit.xml targets sqlite :memory:; these override it so the suite
        # runs on MySQL, matching production. RefreshDatabase migrates fresh.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: restaurant_hub_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # `lint:ci` reports only — the plain `lint` script auto-fixes, which
        # would let a broken commit pass by silently rewriting it.
        run: npm run lint:ci

      - name: Build
        run: npm run build

  # A single required check, so branch protection doesn't need updating
  # whenever the matrix changes.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Verify every job passed
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          [ "${{ needs.backend.result }}" = "success" ] \
            && [ "${{ needs.frontend.result }}" = "success" ]
